<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rock Paper Scissors - Social Preview</title>
<!-- Renders the 1280x640 social preview from this repository's own assets. -->
</head>
<body>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
.card{position:relative;width:1280px;height:640px;overflow:hidden;
      background:radial-gradient(900px 640px at 22% 18%,#24456f 0%,#152a47 46%,#0d1c30 100%)}
.ghost{position:absolute;font-size:190px;opacity:.055;filter:grayscale(1)}
.g1{left:-24px;top:296px;transform:rotate(-14deg)}
.g2{left:392px;top:-46px;transform:rotate(12deg)}
.g3{right:26px;bottom:-52px;transform:rotate(-8deg)}
.g4{left:214px;bottom:-70px;transform:rotate(20deg)}
.left{position:absolute;left:74px;top:118px;width:560px}
.tag{font-size:15px;font-weight:700;letter-spacing:.22em;color:#93c5fd}
.title{margin-top:18px;font-size:76px;font-weight:800;line-height:1.02;letter-spacing:-.02em;
  background:linear-gradient(92deg,#93c5fd 0%,#60a5fa 42%,#a78bfa 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hearts{margin-top:26px;font-size:30px;letter-spacing:.14em;color:#f87171}
.by{margin-top:34px;font-size:21px;font-weight:700;color:#e8eefc;line-height:1.6}
.by span{display:block;font-size:14px;font-weight:600;letter-spacing:.16em;color:#7f9ac4;margin-bottom:9px}
.stack{margin-top:22px;font-size:16px;font-weight:700;letter-spacing:.14em;color:#60a5fa}
.arena{position:absolute;right:96px;top:150px;width:470px;text-align:center}
.hands{display:flex;justify-content:center;align-items:center;gap:56px}
.h{font-size:118px;line-height:1}
.lbl{margin-top:14px;font-size:16px;font-weight:700;letter-spacing:.20em;color:#9fb6d8}
.vs{font-size:26px;font-weight:800;color:#7f9ac4;letter-spacing:.1em;padding-bottom:26px}
.verdict{margin-top:38px;font-size:52px;font-weight:800;color:#4ade80;letter-spacing:-.01em}
.score{margin-top:22px;display:inline-block;padding:12px 30px;border-radius:999px;
  background:rgba(59,130,246,.16);border:2px solid rgba(96,165,250,.45);
  font-size:21px;font-weight:700;color:#dbeafe;letter-spacing:.10em}
</style>
<div class="card">
  <div class="ghost g1">&#9994;</div><div class="ghost g2">&#9995;</div>
  <div class="ghost g3">&#9996;</div><div class="ghost g4">&#9994;</div>
  <div class="left">
    <div class="tag">PROJECT</div>
    <div class="title">Rock Paper<br>Scissors</div>
    <div class="hearts">&#10084;&#65039; &#10084;&#65039; &#10084;&#65039; &#10084;&#65039;</div>
    <div class="stack">HTML &middot; CSS &middot; JAVASCRIPT &middot; 2022</div>
    <div class="by"><span>DESIGNED &amp; DEVELOPED BY</span>Amey Thakur &middot; Mega Satish</div>
  </div>
  <div class="arena">
    <div class="hands">
      <div><div class="h">&#9995;</div><div class="lbl">YOU</div></div>
      <div class="vs">VS</div>
      <div><div class="h">&#9994;</div><div class="lbl">CPU</div></div>
    </div>
    <div class="verdict">You Win!</div>
    <div class="score">SCORE &nbsp;2</div>
  </div>
</div>
</body>
</html>
